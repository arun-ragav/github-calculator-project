<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arun Ragav | Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Profile -->
        <header class="profile">

            <img src="G.K.G.Arun Ragav.png"
                 alt="G.K.G. Arun Ragav"
                 class="profile-image">

            <h1>G.K.G. Arun Ragav</h1>

            <p>B.Tech CSE (Applied AI)</p>

            <p>St. Joseph University, Palanchur</p>

            <a href="https://github.com/arun-ragav"
               target="_blank"
               class="github-link">
                GitHub
            </a>

        </header>


        <!-- Theme Button -->

        <button class="theme-button"
                onclick="toggleTheme()">
            🌙 Dark / ☀️ Light
        </button>


        <!-- Calculator -->

        <main class="calculator">

            <div class="display">

                <div id="history"></div>

                <div id="display">
                    0
                </div>

            </div>


            <div class="buttons">

                <button class="special"
                        onclick="clearCalculator()">
                    AC
                </button>

                <button class="special"
                        onclick="deleteNumber()">
                    DEL
                </button>

                <button class="special"
                        onclick="percentage()">
                    %
                </button>

                <button class="operator"
                        onclick="chooseOperator('/')">
                    ÷
                </button>


                <button onclick="appendNumber('7')">
                    7
                </button>

                <button onclick="appendNumber('8')">
                    8
                </button>

                <button onclick="appendNumber('9')">
                    9
                </button>

                <button class="operator"
                        onclick="chooseOperator('*')">
                    ×
                </button>


                <button onclick="appendNumber('4')">
                    4
                </button>

                <button onclick="appendNumber('5')">
                    5
                </button>

                <button onclick="appendNumber('6')">
                    6
                </button>

                <button class="operator"
                        onclick="chooseOperator('-')">
                    −
                </button>


                <button onclick="appendNumber('1')">
                    1
                </button>

                <button onclick="appendNumber('2')">
                    2
                </button>

                <button onclick="appendNumber('3')">
                    3
                </button>

                <button class="operator"
                        onclick="chooseOperator('+')">
                    +
                </button>


                <button class="zero"
                        onclick="appendNumber('0')">
                    0
                </button>

                <button onclick="appendDecimal()">
                    .
                </button>

                <button class="equal"
                        onclick="calculate()">
                    =
                </button>

            </div>

        </main>


        <!-- Footer -->

        <footer>

            <p>Built with HTML • CSS • JavaScript</p>

            <p>© 2026 G.K.G. Arun Ragav</p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
