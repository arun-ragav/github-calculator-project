<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        G.K.G. Arun Ragav | Scientific Calculator
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <!-- ================= PROFILE ================= -->

        <header class="profile">

            <img
                src="G.K.G.Arun Ragav.png"
                alt="G.K.G. Arun Ragav"
                class="profile-image"
            >

            <h1>
                G.K.G. Arun Ragav
            </h1>

            <p>
                B.Tech CSE (Applied AI)
            </p>

            <p>
                St. Joseph University, Palanchur
            </p>

            <a
                href="https://github.com/arun-ragav"
                target="_blank"
                class="github-link"
            >
                GitHub
            </a>

        </header>


        <!-- ================= THEME ================= -->

        <button
            class="theme-button"
            onclick="toggleTheme()"
        >
            🌙 Dark / ☀️ Light
        </button>


        <!-- ================= CALCULATOR ================= -->

        <main class="calculator">

            <!-- DISPLAY -->

            <div class="display">

                <div id="expression"></div>

                <div id="display">
                    0
                </div>

            </div>


            <!-- COPY RESULT -->

            <button
                class="copy-button"
                onclick="copyResult()"
            >
                📋 Copy Result
            </button>


            <!-- ================= TOP BUTTONS ================= -->

            <div class="top-buttons">

                <button
                    class="special"
                    onclick="clearCalculator()"
                >
                    AC
                </button>

                <button
                    class="special"
                    onclick="deleteNumber()"
                >
                    DEL
                </button>

                <button
                    class="equal"
                    onclick="calculate()"
                >
                    =
                </button>

            </div>


            <!-- ================= MEMORY ================= -->

            <div class="memory-buttons">

                <button onclick="memoryClear()">
                    MC
                </button>

                <button onclick="memoryRecall()">
                    MR
                </button>

                <button onclick="memoryAdd()">
                    M+
                </button>

                <button onclick="memorySubtract()">
                    M−
                </button>

            </div>


            <!-- ================= SCIENTIFIC BUTTONS ================= -->

            <div class="scientific-buttons">

                <button
                    onclick="calculateFunction('sin')"
                >
                    sin
                </button>

                <button
                    onclick="calculateFunction('cos')"
                >
                    cos
                </button>

                <button
                    onclick="calculateFunction('tan')"
                >
                    tan
                </button>

                <button
                    onclick="calculateFunction('log')"
                >
                    log
                </button>

                <button
                    onclick="calculateFunction('ln')"
                >
                    ln
                </button>

                <button onclick="squareRoot()">
                    √
                </button>

                <button onclick="squareNumber()">
                    x²
                </button>

                <button onclick="choosePower()">
                    xʸ
                </button>

                <button onclick="factorial()">
                    x!
                </button>

                <button onclick="appendConstant('pi')">
                    π
                </button>

                <button onclick="appendConstant('e')">
                    e
                </button>

                <button onclick="insertText('(')">
                    (
                </button>

                <button onclick="insertText(')')">
                    )
                </button>

                <button onclick="insertText('E')">
                    EXP
                </button>

                <button onclick="reciprocal()">
                    1/x
                </button>

            </div>


            <!-- ================= NUMBER PAD ================= -->

            <div class="buttons">

                <!-- ROW 1 -->

                <button
                    class="special"
                    onclick="toggleSign()"
                >
                    ±
                </button>

                <button
                    class="operator"
                    onclick="chooseOperator('/')"
                >
                    ÷
                </button>

                <button
                    class="operator"
                    onclick="chooseOperator('*')"
                >
                    ×
                </button>

                <button
                    class="operator"
                    onclick="chooseOperator('-')"
                >
                    −
                </button>


                <!-- ROW 2 -->

                <button onclick="appendNumber('7')">
                    7
                </button>

                <button onclick="appendNumber('8')">
                    8
                </button>

                <button onclick="appendNumber('9')">
                    9
                </button>

                <button
                    class="operator"
                    onclick="chooseOperator('+')"
                >
                    +
                </button>


                <!-- ROW 3 -->

                <button onclick="appendNumber('4')">
                    4
                </button>

                <button onclick="appendNumber('5')">
                    5
                </button>

                <button onclick="appendNumber('6')">
                    6
                </button>

                <button
                    class="special"
                    onclick="percentage()"
                >
                    %
                </button>


                <!-- ROW 4 -->

                <button onclick="appendNumber('1')">
                    1
                </button>

                <button onclick="appendNumber('2')">
                    2
                </button>

                <button onclick="appendNumber('3')">
                    3
                </button>

                <button onclick="appendDecimal()">
                    .
                </button>


                <!-- ROW 5 -->

                <button
                    class="zero"
                    onclick="appendNumber('0')"
                >
                    0
                </button>

            </div>

        </main>


        <!-- ================= HISTORY ================= -->

        <section class="history-section">

            <div class="history-header">

                <h2>
                    Calculation History
                </h2>

                <button onclick="clearHistory()">
                    Clear
                </button>

            </div>

            <ul id="history-list"></ul>

        </section>


        <!-- ================= FOOTER ================= -->

        <footer>

            <h2>
                Scientific Calculator
            </h2>

            <h3>
                Built with HTML • CSS • JavaScript
            </h3>

            <h2>
                © 2026 G.K.G.Arun Ragav
            </h2>
            <h1>ALL RIGHTS RESERVED✨</h1>

        </footer>

    </div>


    <script src="app.js"></script>

</body>

</html>
